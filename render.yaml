services:
  - type: web
    name: chatapp-backend-production
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths: [apps/backend/**, packages/shared/**, pnpm-lock.yaml, pnpm-workspace.yaml]
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @chatapp/backend build
    startCommand: node apps/backend/dist/server.js
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: MONGODB_URI, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_KEY, sync: false }
      - { key: SUPABASE_BUCKET, sync: false }
      - { key: JWT_SECRET, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: EMAIL_FROM, sync: false }
      - { key: CLIENT_URL, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: SENTRY_DSN, sync: false }

  - type: web
    name: chatapp-backend-staging
    runtime: node
    plan: free
    region: oregon
    branch: staging
    autoDeployTrigger: checksPass
    buildFilter:
      paths: [apps/backend/**, packages/shared/**, pnpm-lock.yaml, pnpm-workspace.yaml]
    buildCommand: pnpm install --frozen-lockfile --prod && pnpm --filter @chatapp/backend build
    startCommand: node apps/backend/dist/server.js
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: staging }
      - { key: MONGODB_URI, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_KEY, sync: false }
      - { key: SUPABASE_BUCKET, sync: false }
      - { key: JWT_SECRET, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: EMAIL_FROM, sync: false }
      - { key: CLIENT_URL, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: SENTRY_DSN, sync: false }