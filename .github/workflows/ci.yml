# CI — ChatApp
# Runs on: push to `main`, PRs targeting `main`
# Jobs: check (typecheck → lint → build)
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  PNPM_VERSION: "8.15.0"
  NODE_VERSION: "20"

jobs:
  check:
    name: Typecheck / Lint / Build / Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint (skipped until an ESLint config exists)
        run: |
          if ls eslint.config.* .eslintrc* >/dev/null 2>&1; then
            pnpm lint
          else
            echo "No ESLint config found — skipped"
          fi

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: "http://localhost:4000"

  # Security auditing is handled by Dependabot (enabled on the repo).
